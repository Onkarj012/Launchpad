# Portal Scanner Configuration
# Used by career-ops scan to discover new offers automatically.

scan_history:
  recheck_after_days: 30

# Broad prefilter only. Root job-pull eligibility is authoritative and rejects
# bare "Remote", region-restricted remote, and non-Pune onsite/hybrid roles.
location_filter:
  always_allow:
    - "India"
    - "Pune"
    - "Pimpri-Chinchwad"
    - "Pimpri Chinchwad"
    - "PCMC"
    - "Hinjawadi"
    - "Hinjewadi"
    - "Wakad"
    - "Baner"
    - "Kharadi"
    - "Magarpatta"
    - "Viman Nagar"
    - "Talawade"
  allow:
    - "India"
    - "Maharashtra"
    - "Remote"
    - "Pune"
    - "Pimpri"
    - "Chinchwad"
    - "Hinjawadi"
    - "Hinjewadi"
    - "Wakad"
    - "Baner"
    - "Kharadi"
    - "Magarpatta"
    - "Viman Nagar"
    - "Talawade"
    - "APAC"
    - "Asia-Pacific"
    - "Asia Pacific"
    - "Worldwide"
    - "Global"
  block: []

skip_tiers:
  - "senior"

title_filter:
  positive:
    - "AI Engineer"
    - "LLM Engineer"
    - "Machine Learning Engineer"
    - "ML Engineer"
    - "Agentic"
    - "Backend Engineer"
    - "Python Engineer"
    - "Full Stack Engineer"
    - "Software Engineer"
    - "New Grad"
    - "Entry Level"
    - "Associate Software Engineer"
    - "Graduate Software Engineer"
    - "Software Engineer Intern"
    - "Machine Learning Intern"
    - "ML Intern"
    - "AI Intern"
    - "Backend Intern"
    - "AI/ML"
    - "Software Development Engineer"
    - "SDE"
    - "Python Developer"
    - "Backend Developer"
    - "Back-end Developer"
    - "Full Stack Developer"
    - "Full-Stack Developer"
    - "AI Developer"
    - "GenAI Developer"
    - "Gen AI"
    - "ML Developer"
    - "Machine Learning Developer"
    - "Junior Developer"
    - "Junior Engineer"
    - "Associate Engineer"
    - "Graduate Engineer"
    - "Member of Technical Staff"
    - "Software Developer"
    - "AI/ML Developer"
  negative:
    - "Senior"
    - "Staff Engineer"
    - "Staff Software"
    - "Principal"
    - "Lead"
    - "Director"
    - "Manager"
    - "Head of"
    - "VP"
    - "Architect"
    - "Distinguished"
    - "Sales"
    - "Recruiter"
    - "Marketing"
    - "Accountant"
    - "Attorney"
    - "Designer"

